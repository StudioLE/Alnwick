name: CI/CD

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci-cd:
    name: CI/CD
    uses: StudioLE/Actions/.github/workflows/ci-cd-rust.yml@v8
    with:
      package_name: alnwick
      binary_name: alnwick
      test_args: --workspace --exclude alnwick_dioxus
      check_args: --workspace --exclude alnwick_dioxus
      run_before_test: |
        mkdir -p "${HOME}/.cache/alnwick"
        mkdir -p "${HOME}/.local/share/alnwick"
        target/${MATRIX_TARGET}/release/alnwick add irl https://irlpodcast.org
      docker_name: alnwick
      docker_args: >
        --file docker/cli/Dockerfile
        --build-arg VERSION="${VERSION}"
      brew_repo: StudioLE/homebrew-tap
      brew_formula_file: .github/brew/formula.template.rb
    secrets:
      cargo_registry_token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      docker_password: ${{ secrets.GITHUB_TOKEN }}
      brew_repo_token: ${{ secrets.BREW_REPO_TOKEN }}
